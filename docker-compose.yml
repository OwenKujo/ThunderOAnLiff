services:
  postgres:
    image: postgres:16-alpine
    container_name: thunder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: thunder_oan_liff
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
